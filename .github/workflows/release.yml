name: Build & Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # OBAVEZNO za setuptools_scm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify version is clean
        run: |
          VERSION=$(python -c "import importlib.metadata as m; print(m.version('wattleflow-workflow'))")
          echo "Version: $VERSION"
          if [[ "$VERSION" == *dev* ]] || [[ "$VERSION" == *post* ]]; then
            echo "Non-clean version detected!"
            exit 1
          fi

      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}