

[project]
name = "wattleflow-workflow"
version = "0.0.0.83"
description = "Wattleflow Workflow - Data engineering framework."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "wattleflow", email = "wattleflow@outlook.com" }]
keywords = ["wattleflow", "workflow", "data", "engineering", "framework", "python", "library", "software engineering"]
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "wattleflow",
]

[build-system]
requires = ["setuptools", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://github.com/wattleflow/workflow.git"
repository = "https://github.com/wattleflow/workflow.git"
documentation = "https://github.com/wattleflow/workflow.git"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
# Vendored OSCAL resources (ASD ISM catalog/profiles, NIST->ISM crosswalk) must
# ship with the wheel; the loaders read them at runtime.
"wattleflow.oscal" = ["resources/**/*.json"]

#[tool.setuptools_scm]
#write_to = "src/wattleflow/concrete/_version.py"
#version_scheme = "post-release"
#local_scheme = "node-and-date"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]
# wattleflow.core ships in the separate `wattleflow` dependency (reached here via
# a dev symlink); api is a FastAPI MVC layer kept out of the core package.
exclude = ["wattleflow.api*", "wattleflow.core*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E203", "E731", "I001"]  # I001/I003 - isort import order (intentionally not followed in this project)


# E/W = pycodestyle, F = pyflakes (Flake8 equivalent), I = isort, B = flake8-bugbear
# E203 - whitespace before ':' (conflicts with Black/slice notation)
# E731 - do not assign a lambda expression (intentionally used in this project)
# python -m pip install --upgrade pip setuptools wheel
# pip list --outdated
# strace -f -e trace=file -o trace.log pip install -e .
# strace -f -e trace=file -o trace.log pip list --outdated
