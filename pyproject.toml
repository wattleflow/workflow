[project]
name = "wattleflow-workflow"
version = "0.0.0.93"
description = "Wattleflow Workflow - Data engineering framework."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "wattleflow", email = "wattleflow@outlook.com" }]
keywords = ["wattleflow", "workflow", "data", "engineering", "framework", "python", "library", "software engineering"]
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The core is a hard runtime dependency and its contracts are NOT stable across
# patch-level releases: v0.0.0.46 turned IWattleflow into an ABC with an abstract
# `name`, dropped ISingleton and the T/W TypeVars, and renamed behavioral.py ->
# behavioural.py. Anything below that floor fails at import time, so the floor is
# pinned. An upper cap is deliberately absent — capping every 0.0.0.x bump needs
# the version policy (DR-013) to say what a breaking core release looks like.
dependencies = [
    "wattleflow>=0.0.0.49",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://github.com/wattleflow/workflow.git"
repository = "https://github.com/wattleflow/workflow.git"
documentation = "https://github.com/wattleflow/documentation.git"

[tool.setuptools]
package-dir = {"" = "src"}
# File selection is MANIFEST.in's job (see its header): package-data would be a
# second, competing source of truth for what ships.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# `wattleflow` is an implicit namespace package (no __init__.py) so that sibling
# distributions can ship wattleflow.core, wattleflow.processors, etc. Without
# `namespaces = true` the finder returns NOTHING over such a tree and the wheel
# ships no modules at all, while the source tree looks healthy.
namespaces = true
# Allowlist, not denylist (mirrors the core distribution): what is not listed is
# not shipped, so a new directory under src/wattleflow cannot leak into the wheel
# by being forgotten — and non-package assets never become packages.
# INVARIANT: every entry here must be covered by MANIFEST.in, or it installs as
# an empty directory and the consumer's import fails at runtime, not at install.
include = [
    "wattleflow.concrete*",
    "wattleflow.constants*",
    "wattleflow.decorators*",
    "wattleflow.helpers*",
    "wattleflow.managers*",
    "wattleflow.orchestrators*",
    "wattleflow.schedulers*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E203", "E731", "I001"]
