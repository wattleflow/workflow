[project]
name = "wattleflow-workflow"
version = "0.0.1.53"
description = "Wattleflow Workflow - Data engineering framework."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "wattleflow", email = "wattleflow@outlook.com" }]
keywords = ["wattleflow", "workflow", "data", "engineering", "framework", "python", "library", "software engineering"]
requires-python = ">=3.12.14"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "wattleflow>=0.0.0.61",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://github.com/wattleflow/workflow.git"
repository = "https://github.com/wattleflow/workflow.git"
documentation = "https://github.com/wattleflow/documentation.git"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

include = [
    "wattleflow.audit*",
    "wattleflow.concrete*",
    "wattleflow.constants*",
    "wattleflow.decorators*",
    "wattleflow.enums*",
    "wattleflow.helpers*",
    "wattleflow.managers*",
    "wattleflow.orchestrators*",
    "wattleflow.schedulers*",
    "wattleflow.telemetry*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E203", "E731", "I001"]
