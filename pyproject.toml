[project]
name = "wattleflow-workflow"
version = "0.0.0.87"
description = "Wattleflow Workflow - Data engineering framework."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "wattleflow", email = "wattleflow@outlook.com" }]
keywords = ["wattleflow", "workflow", "data", "engineering", "framework", "python", "library", "software engineering"]
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The core is a hard runtime dependency and its contracts are NOT stable across
# patch-level releases: v0.0.0.46 turned IWattleflow into an ABC with an abstract
# `name`, dropped ISingleton and the T/W TypeVars, and renamed behavioral.py ->
# behavioural.py. Anything below that floor fails at import time, so the floor is
# pinned. An upper cap is deliberately absent — capping every 0.0.0.x bump needs
# the version policy (DR-013) to say what a breaking core release looks like.
dependencies = [
    "wattleflow>=0.0.0.47",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://github.com/wattleflow/workflow.git"
repository = "https://github.com/wattleflow/workflow.git"
documentation = "https://github.com/wattleflow/documentation.git"

[tool.setuptools]
package-dir = {"" = "src"}
# File selection is MANIFEST.in's job (see its header): package-data would be a
# second, competing source of truth for what ships.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# wattleflow.core ships in the separate `wattleflow` dependency (reached here via
# a dev symlink); api is a FastAPI MVC layer kept out of the core package.
# Every package this leaves declared must also be shipped by MANIFEST.in, or it
# installs empty — see the INVARIANT in that file.
exclude = ["wattleflow.api*", "wattleflow.core*"]

[tool.ruff]
line-length = 100
# Must track requires-python above; they disagreed (py310 vs >=3.11) until 0.0.0.87.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E203", "E731", "I001"]  # I001/I003 - isort import order (intentionally not followed in this project)


# E/W = pycodestyle, F = pyflakes (Flake8 equivalent), I = isort, B = flake8-bugbear
# E203 - whitespace before ':' (conflicts with Black/slice notation)
# E731 - do not assign a lambda expression (intentionally used in this project)
# python -m pip install --upgrade pip setuptools wheel
# pip list --outdated
# strace -f -e trace=file -o trace.log pip install -e .
# strace -f -e trace=file -o trace.log pip list --outdated
